<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朗读桥</title>
<style>
  :root{
    --bg:#0f1115; --line:#262b36; --fg:#e6e9ef; --dim:#98a2b3;
    --dim-text:rgba(230,233,239,.52); --bar:rgba(15,17,21,.82); --field:#0c0e12;
    --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --accent:#60a5fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Mono", monospace;
    color-scheme: dark;
  }
  /* The palette follows DSH, not the OS: the Host sends its scheme with the text. */
  :root[data-theme="light"]{
    --bg:#fbfbfa; --line:#e3e4e8; --fg:#1f2329; --dim:#6b7280;
    --dim-text:rgba(31,35,41,.55); --bar:rgba(251,251,250,.84); --field:#ffffff;
    --ok:#22a06b; --warn:#b45309; --err:#c0392b; --accent:#2563eb;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}

  /* One floating layer: the controls. Everything else is the page itself. */
  .bar{position:sticky;top:0;z-index:10;background:var(--bar);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar-inner{max-width:44rem;margin:0 auto;padding:0 16px;height:52px;
    display:flex;align-items:center;gap:8px}
  .progress{height:2px;background:transparent}
  #fill{height:100%;width:0;background:var(--accent);transition:width .25s linear}

  /* Voice picker: one searchable field, the list only exists while it is open.
     A system can expose 10 000+ voices (espeak-ng), so a <select> is a trap. */
  .picker{position:relative;flex:1 1 auto;min-width:0;margin-right:auto}
  #voiceSearch{width:100%;max-width:26rem;background:var(--field);color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:5px 24px 5px 8px;font:inherit;font-size:12.5px;
    min-width:0}
  #voiceSearch:focus{outline:none;border-color:var(--accent)}
  /* A plain caret instead of the search box's clear button. */
  .caret{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;
    display:flex;align-items:center;color:var(--dim)}
  /* The list may grow wider than the field: voice names are long. */
  #voiceList{position:absolute;top:calc(100% + 6px);left:0;z-index:20;
    width:max-content;min-width:100%;max-width:min(36rem, 88vw);
    max-height:min(320px,60vh);overflow:auto;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:4px}
  #voiceList .item{padding:5px 8px;border-radius:6px;font-size:12.5px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #voiceList .item:hover,#voiceList .item.hover{background:rgba(96,165,250,.18)}
  #voiceList .item.current{color:var(--accent);font-weight:600}
  #voiceList .more{padding:4px 8px;font-size:11.5px;color:var(--dim)}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);
    cursor:pointer;user-select:none;white-space:nowrap}
  .rate-wrap{display:inline-flex;align-items:center;gap:5px}
  /* A drawn track: the platform default track is white-on-white in light mode. */
  input[type=range]{width:88px;height:18px;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;
    border:0;border-radius:50%;background:var(--accent)}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent)}
  input[type=range]:focus{outline:none}
  input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  .val{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:44px}

  button{background:transparent;color:var(--fg);border:1px solid transparent;border-radius:7px;
    width:32px;height:30px;font:inherit;font-size:13px;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center}
  button svg{width:16px;height:16px;display:block;pointer-events:none}
  /* The play button holds all three glyphs; data-icon picks one. */
  #btnPlay svg{display:none}
  #btnPlay[data-icon=play] .i-play,
  #btnPlay[data-icon=pause] .i-pause,
  #btnPlay[data-icon=replay] .i-replay{display:block}
  button:hover:not(:disabled){background:#222736}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.play{width:36px;border-color:var(--line)}

  .dot{width:8px;height:8px;border-radius:50%;background:#4b5563;margin-left:4px;flex:none}
  .dot.ok{background:var(--ok)}
  .dot.warn{background:var(--warn)}

  #banner{display:none;max-width:44rem;margin:0 auto;padding:7px 20px;font-size:12.5px;line-height:1.5}
  #banner.show{display:block}
  #banner.warn{color:var(--warn)}
  #banner.err{color:var(--err)}

  /* Full-page scroll, one readable column: no inner scrollers. */
  main{max-width:44rem;margin:0 auto;padding:26px 20px 45vh}
  h1{font-size:19px;margin:0 0 4px;font-weight:600;line-height:1.4}
  .sub{color:var(--dim);font-size:12.5px}
  .doc{margin-top:22px}
  .doc p{margin:0 0 1.15em;font-size:17px;line-height:1.85;color:var(--dim-text);
    transition:color .18s ease}
  .doc p.on{color:var(--fg)}
  /* What is already behind you: read paragraphs fade, the current one stays bright. */
  .doc p.read{opacity:.42}
  .doc p.mark{background:rgba(96,165,250,.14);border-radius:4px}
  .doc p.empty{color:var(--dim);font-size:15px}
  ::highlight(bridge-para){background-color:rgba(96,165,250,.14)}
  ::highlight(bridge-word){background-color:#f5c542;color:#241a00}
  @media (max-width: 600px) {
    .bar-inner{gap:6px;padding:0 12px}
    main{padding:20px 14px 45vh}
    input[type=range]{width:64px}
  }
</style>
</head>
<body>
<div class="bar">
  <div class="bar-inner">
    <span class="picker">
      <input id="voiceSearch" type="text" autocomplete="off" spellcheck="false"
             placeholder="音色：点开或输入筛选" title="音色（可输入筛选）">
      <span class="caret" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
      <div id="voiceList" hidden></div>
    </span>
    <label class="chk" title="只列出离线音色，不连厂商服务器"><input type="checkbox" id="onlyLocal"> <span id="onlyLocalText">本地</span></label>
    <span class="rate-wrap">
      <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1" title="语速">
      <span class="val" id="rateVal">1.00×</span>
    </span>
    <button id="btnPrev" title="上一段" disabled aria-label="上一段">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 5v14a1 1 0 0 1-1.6.8L9 13.5V19a1 1 0 0 1-2 0V5a1 1 0 0 1 2 0v5.5l8.4-6.3A1 1 0 0 1 19 5z"/></svg>
    </button>
    <button id="btnPlay" class="play" title="开始朗读" data-icon="play" aria-label="开始朗读">
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.6c0-1 1.1-1.6 1.9-1L19 11c.8.5.8 1.5 0 2L8.9 20.4c-.8.6-1.9 0-1.9-1z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
      <svg class="i-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg>
    </button>
    <button id="btnNext" title="下一段" disabled aria-label="下一段">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5v14a1 1 0 0 0 1.6.8l8.4-6.3V19a1 1 0 0 0 2 0V5a1 1 0 0 0-2 0v5.5L6.6 4.2A1 1 0 0 0 5 5z"/></svg>
    </button>
    <button id="btnStop" title="停止" disabled aria-label="停止">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    </button>
    <span id="dot" class="dot" title="未连接 DSH"></span>
  </div>
  <div class="progress"><div id="fill"></div></div>
</div>

<div id="banner"></div>

<main>
  <h1 id="title"></h1>
  <div id="sub" class="sub"></div>
  <div id="doc" class="doc"></div>
</main>

<script>/* The Host substitutes the text placeholder; opened straight from disk there is none. */
try { window.__BRIDGE__ = __BRIDGE_DATA__ } catch (e) { window.__BRIDGE__ = {} }</script>
<script>
(function () {
  'use strict';
  var data = window.__BRIDGE__ || {};
  /** Keep the page in the app's palette; opened from disk it stays dark. */
  function applyScheme(scheme) {
    try {
      document.documentElement.setAttribute('data-theme', scheme === 'light' ? 'light' : 'dark');
    } catch (e) {}
  }
  applyScheme(data.scheme);
  // ?demo=1 fills the page with a sample so it can be tried without DSH. The
  // hash works too, because some browsers drop the query on file:// URLs.
  var demo = /[?&]demo=1/.test(window.location.search || '') || /demo/.test(window.location.hash || '');
  if (demo && !(Array.isArray(data.units) && data.units.length)) {
    data = {
      title: '朗读桥 · 自测文本',
      speed: 1,
      units: [
        { text: '这是朗读桥的自测文本。段落高亮是淡蓝色，读到哪个词，那个词会变成黄色。' },
        { text: '缓存 缓存 缓存：同一个词在一段里出现多次时，只高亮正在读的那一处，不会来回跳。' },
        { text: '如果这里提示没有可用音色，说明系统没装语音合成后端（Linux 上是 speech-dispatcher）。' },
      ],
    };
  }
  var units = Array.isArray(data.units) ? data.units.map(function (u, i) {
    return { index: i, text: String((u && u.text) || '') };
  }) : [];
  var synth = window.speechSynthesis;
  var Utter = window.SpeechSynthesisUtterance;
  var FIRST_SOUND_TIMEOUT = 8000;
  var VOICE_KEY = 'dsh-tts-bridge:voice-v2';
  var FOLLOW_RESUME_MS = 3000;

  var el = {};
  ['fill','banner','voiceSearch','voiceList','onlyLocal','onlyLocalText','btnPrev','btnPlay','btnNext','btnStop',
   'rate','rateVal','dot','title','sub','doc'].forEach(function (id) { el[id] = document.getElementById(id); });

  var st = {
    voices: [], visible: [], idx: 0, running: false, paused: false, stop: false,
    gen: 0, watchdog: 0, boundary: 0, attempted: false, startedAt: 0,
    rate: 1, savedUri: '', paragraphs: [], userScrolledAt: 0,
    listOpen: false, filter: '', hover: -1,
    // Pushes that arrived while something was playing wait here, in order: a
    // newer push must never cut off the paragraph being spoken.
    queue: [], active: null, done: false,
    dotState: 'idle', dotTitle: '未连接 DSH',
    // Progress: characters already finished, plus where this paragraph started.
    charStarts: [], totalChars: 0, baseChars: 0, paraStart: 0, paraLen: 0,
    paraBoundary: 0, sawBoundary: false
  };

  /** Where the bridge's own API lives, or null when this page has no Host. */
  function apiBase() {
    try {
      if (!/^https?:$/.test(window.location.protocol || '')) return null;
      return String(window.location.pathname || '').replace(/\/[^/]*$/, '');
    } catch (e) { return null; }
  }

  /** Tell the Host what happened to one push: received, state, stopped. */
  function ack(id, kind, messageId, units, extra) {
    if (!id) return;
    var dir = apiBase();
    if (dir === null) return;
    var body = { id: String(id), kind: String(kind) };
    if (messageId) body.messageId = String(messageId);
    if (typeof units === 'number') body.units = units;
    if (extra) for (var name in extra) body[name] = extra[name];
    var json = JSON.stringify(body);
    try {
      if (navigator.sendBeacon) {
        var blob = new Blob([json], { type: 'application/json' });
        if (navigator.sendBeacon(dir + '/bridge/ack', blob)) return;
      }
    } catch (e) {}
    try {
      fetch(dir + '/bridge/ack', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: json,
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  /** Mirror the current reading state back to the app (wave / pause / queue). */
  function reportState(phase) {
    var active = st.active;
    if (!active || !active.id) return;
    ack(active.id, 'state', active.messageId, undefined, {
      key: active.key || '',
      phase: phase,
      unit: Math.min(st.idx, units.length),
      total: units.length,
      queued: st.queue.length
    });
  }

  /** A push that had to wait: the app can show its spinner meanwhile. */
  function reportQueued(payload) {
    if (!payload || !payload.id) return;
    ack(payload.id, 'state', payload.messageId, undefined, {
      key: payload.key || '',
      phase: 'queued',
      unit: 0,
      total: (payload.units || []).length,
      queued: st.queue.length
    });
  }

  /** The page's language; DSH sends it with every push and on prefs changes. */

    // keep the read marks so a mid-read language switch does not erase progress.

    renderHead();
    paint();

    el.voiceSearch.setAttribute('placeholder', tr('voicePlaceholder'));
    el.voiceSearch.setAttribute('title', tr('voiceFieldTitle'));
    el.onlyLocal.setAttribute('title', tr('localOnlyTitle'));
    if (el.onlyLocalText) el.onlyLocalText.textContent = tr('localOnly');
    el.rate.setAttribute('title', tr('speedTitle'));
    el.btnPrev.setAttribute('title', tr('prevPara'));
    el.btnPrev.setAttribute('aria-label', tr('prevPara'));
    el.btnNext.setAttribute('title', tr('nextPara'));
    el.btnNext.setAttribute('aria-label', tr('nextPara'));
    el.btnStop.setAttribute('title', tr('stopReading'));
    el.btnStop.setAttribute('aria-label', tr('stopReading'));
    if (!st.running) el.btnPlay.setAttribute('title', st.done ? tr('replay') : tr('playStart'));

    if (/[\uac00-\ud7af]/.test(sample)) return 'ko';

      if (lang === 'en' && pref !== 'en') return 2;
      return 3;

    });
  }

  function itemClass(index, hover) {
    var v = listShown.items[index];
    return 'item' + (index === hover ? ' hover' : '') + (v && v.voiceURI === st.savedUri ? ' current' : '');
  }

  /** Rebuild the open list from the first page. */
  function renderVoiceList() {
    listShown.items = matchingVoices();
    listShown.count = 0;
    el.voiceList.textContent = '';
    el.voiceList.hidden = false;
    st.listOpen = true;
    if (st.hover >= listShown.items.length) st.hover = 0;
    if (listShown.items.length === 0) {
      var none = document.createElement('div');
      none.className = 'more';
      none.textContent = tr('noMatch');
      el.voiceList.appendChild(none);
      return;
    }
    appendVoicePage();
  }

  /** Add the next page of rows (and keep the "how many more" line up to date). */
  function appendVoicePage() {
    var items = listShown.items;
    var from = listShown.count;
    var to = Math.min(items.length, from + LIST_PAGE);
    var more = el.voiceList.querySelector('.more');
    if (more) more.parentNode.removeChild(more);
    for (var i = from; i < to; i += 1) {
      var v = items[i];
      var item = document.createElement('div');
      item.className = itemClass(i, st.hover);
      item.setAttribute('data-i', String(i));
      item.textContent = voiceLabel(v);
      item.title = String(v.voiceURI || '');
      (function (voice) {
        item.addEventListener('mousedown', function (event) {
          event.preventDefault();
          chooseVoice(voice);
        });
      })(v);
      el.voiceList.appendChild(item);
    }
    listShown.count = to;
    if (to < items.length) {
      var node = document.createElement('div');
      node.className = 'more';
      node.textContent = fmt('moreVoices', { n: items.length - to });
      el.voiceList.appendChild(node);
    }
  }

  /** Keyboard highlight: draw more rows if it runs past what is on screen. */
  function setVoiceHover(index) {
    st.hover = Math.max(0, Math.min(index, listShown.items.length - 1));
    while (listShown.count <= st.hover && listShown.count < listShown.items.length) appendVoicePage();
    var rows = el.voiceList.querySelectorAll('.item');
    for (var i = 0; i < rows.length; i += 1) rows[i].className = itemClass(i, st.hover);
    if (rows[st.hover] && rows[st.hover].scrollIntoView) {
      try { rows[st.hover].scrollIntoView({ block: 'nearest' }); } catch (e) {}
    }
  }

  function closeVoiceList() {
    st.listOpen = false;
    el.voiceList.hidden = true;
    st.filter = '';
    st.hover = -1;
    listShown.items = [];
    listShown.count = 0;
    paintVoiceField();
  }

  function chooseVoice(v) {
    selectVoice(v);
    try { localStorage.setItem(VOICE_KEY, v.voiceURI || ''); } catch (e) {}
    closeVoiceList();
    paint();
  }

  /** The settings page owns the speed; it arrives with the text. */
  function applySpeed(value) {
    var next = Number(value);
    if (!isFinite(next) || next <= 0) return;
    st.rate = Math.min(2, Math.max(0.5, Math.round(next * 100) / 100));
    el.rate.value = String(st.rate);
    el.rateVal.textContent = st.rate.toFixed(2) + '×';
  }

  /* ---------- speaking ---------- */

  function clearWatchdog() { if (st.watchdog) { clearTimeout(st.watchdog); st.watchdog = 0; } }

  /* ---------- progress: characters read, not paragraphs crossed ---------- */

  var progressTimer = 0;

  function startProgress() {
    stopProgress();
    progressTimer = setInterval(tickProgress, 200);
    tickProgress();
  }

  function stopProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = 0; }
  }

  /** Characters finished so far. Exact while the voice reports word boundaries;
   *  otherwise the bar steps once per paragraph, because a guess would lie. */
  function charsRead() {
    if (!st.running) return st.baseChars || 0;
    var start = st.charStarts[st.idx] || 0;
    if (st.sawBoundary) return Math.min(st.totalChars || 0, start + st.paraBoundary);
    return Math.min(st.totalChars || 0, start);
  }

  function tickProgress() {
    if (!st.totalChars || !st.running) return;
    var pct = Math.max(0, Math.min(99, (charsRead() / st.totalChars) * 100));
    el.fill.style.width = pct.toFixed(2) + '%';
  }

  function paint() {
    var done = st.done && !st.running && !st.paused;
    el.btnPlay.disabled = !units.length;
    // The button holds all three glyphs; the attribute picks one.
    el.btnPlay.setAttribute('data-icon', st.running ? (st.paused ? 'play' : 'pause') : (done ? 'replay' : 'play'));
    var playTitle = st.running
      ? (st.paused ? tr('resume') : tr('pause'))
      : (done ? fmt('replay', { n: units.length }) : tr('playStart'));
    el.btnPlay.title = playTitle;
    el.btnPlay.setAttribute('aria-label', playTitle);
    el.btnPrev.disabled = !units.length || st.idx <= 0;
    el.btnNext.disabled = !units.length || st.idx >= units.length - 1;
    el.btnStop.disabled = !st.running && !st.paused;
    paintDot();
  }

  /** Connection state plus how many pushes are waiting behind the current one. */
  function paintDot() {
    var queued = st.queue.length;
    el.dot.className = 'dot' + (st.dotState === 'ok' ? ' ok' : st.dotState === 'warn' ? ' warn' : '');
    el.dot.title = st.dotTitle + (queued ? fmt('queued', { n: queued }) : '');
  }

  function abort(reason, canRetryLocal) {
    var played = st.active;
    // A state report needs the active push, so send it before clearing it.
    reportState('stopped');
    st.active = null;
    st.done = false;
    // A failing voice would fail the whole queue the same way: drop it.
    st.queue.length = 0;
    st.stop = true;
    st.running = false;
    st.paused = false;
    clearWatchdog();
    stopProgress();
    try { synth && synth.cancel(); } catch (e) {}
    banner('err', reason + (canRetryLocal ? tr('retryLocalHint') : ''));
    var local = pickLocalVoice();
    if (canRetryLocal && local && selectVoice(local)) {
      banner('warn', reason + fmt('switchedLocal', { name: local.name }));
    }
    if (played) ack(played.id, 'stop', played.messageId, 0);
    paint();
  }

  /** One utterance per paragraph, all queued now: the engine never waits on us. */
  function speakFrom(from, skip) {
    if (!units.length) return;
    var start = Math.max(0, Math.min(from, units.length - 1));
    var base = Math.max(0, Math.min(skip || 0, Math.max(0, paragraphText(start).length - 1)));
    var gen = ++st.gen;
    var started = false;
    st.stop = false;
    st.paused = false;
    st.running = true;
    st.idx = start;
    st.boundary = base;
    st.attempted = false;
    clearWatchdog();
    try { synth.cancel(); } catch (e) {}
    paintPara(start);
    follow(start);
    paint();
    reportState('playing');
    // The bar follows characters; reset it to where this run begins.
    st.baseChars = st.charStarts[start] || 0;
    st.paraBoundary = base;
    st.sawBoundary = false;
    el.fill.style.width = ((st.baseChars / (st.totalChars || 1)) * 100).toFixed(2) + '%';
    startProgress();

    var voice = currentVoice();
    var items = [];
    for (var i = start; i < units.length; i++) {
      var text = String((units[i] && units[i].text) || '');
      var begin = i === start ? base : 0;
      var rest = text.slice(begin);
      if (rest) items.push({ index: i, begin: begin, rest: rest });
    }

    clearWatchdog();
    st.watchdog = setTimeout(function () {
      st.watchdog = 0;
      if (started || st.stop) return;
      var local = pickLocalVoice();
      abort(fmt('noSoundTimeout', { sec: FIRST_SOUND_TIMEOUT / 1000 }), !!local);
    }, FIRST_SOUND_TIMEOUT);

    // Chrome drops speak() calls issued in the same tick as cancel().
    setTimeout(function () {
      if (gen !== st.gen) return;
      items.forEach(function (item) {
        var utter = new Utter(item.rest);
        if (voice) { utter.voice = voice; utter.lang = voice.lang; }
        utter.rate = st.rate;
        utter.pitch = 1;
        utter.volume = 1;

        utter.onstart = function () {
          if (gen !== st.gen) return;
          started = true;
          clearWatchdog();
          if (!st.startedAt) st.startedAt = performance.now();
          st.idx = item.index;
          st.boundary = item.begin;
          st.baseChars = st.charStarts[item.index] || 0;
          st.paraBoundary = item.begin;
          st.sawBoundary = false;
          paintPara(item.index);
          follow(item.index);
          paint();
          reportState('playing');
          try { if (synth.paused && !st.paused) synth.resume(); } catch (e) {}
        };
        utter.onboundary = function (e) {
          if (gen !== st.gen || typeof e.charIndex !== 'number') return;
          st.boundary = item.begin + e.charIndex;
          st.sawBoundary = true;
          st.paraBoundary = st.boundary;
          paintWord(item.index, st.boundary, e.charLength || 1);
        };
        utter.onend = function () {
          if (gen !== st.gen) return;
          if (item.index + 1 < units.length) return;
          clearWatchdog();
          finish();
        };
        utter.onerror = function (e) {
          if (gen !== st.gen) return;
          var err = (e && e.error) || 'unknown';
          if (err === 'interrupted' || err === 'canceled') return;
          clearWatchdog();
          if (err === 'not-allowed') {
            // Autoplay policy: not a failure, a request for one click.
            st.running = false;
            st.paused = false;
            st.gen++;
            banner('warn', tr('needsClick'));
            paint();
            return;
          }
          abort(fmt('paraFailed', { n: item.index + 1, err: err }), false);
        };

        try {
          synth.speak(utter);
          st.attempted = true;
        } catch (e) {
          abort(fmt('refused', { err: e && e.message ? e.message : String(e) }), false);
        }
      });
    }, 30);
  }

  function finish() {
    st.running = false;
    st.paused = false;
    clearWatchdog();
    stopProgress();
    st.idx = units.length;
    st.done = true;
    paintWordClear();
    markRead(units.length);
    el.fill.style.width = '100%';
    if (st.startedAt) setStatus(fmt('finished', { n: units.length, time: fmtDuration(performance.now() - st.startedAt) }));
    // "Done" is a state, not a badge: the app goes back to its speaker icon.
    reportState('finished');
    st.active = null;
    paint();
    drainQueue();
  }

  function start() {
    if (!units.length) return;
    if (!currentVoice()) { banner('err', tr('noVoice')); return; }
    clearBanner();
    st.startedAt = 0;
    st.done = false;
    speakFrom(0, 0);
  }

  function stop() {
    var played = st.active;
    reportState('stopped');
    st.active = null;
    st.done = false;
    // Stop is the only "drop it" gesture: everything waiting goes too.
    st.queue.length = 0;
    st.stop = true;
    st.running = false;
    st.paused = false;
    st.gen++;
    clearWatchdog();
    stopProgress();
    try { synth.cancel(); } catch (e) {}
    el.fill.style.width = '0%';
    setStatus(tr('stopped'));
    // Nothing is being read, so nothing should stay marked.
    paintWordClear();
    try {
      if (window.CSS && window.CSS.highlights) window.CSS.highlights.delete('bridge-para');
    } catch (e) {}
    st.paragraphs.forEach(function (p) { p.classList.remove('on'); p.classList.remove('mark'); });
    if (played) ack(played.id, 'stop', played.messageId, 0);
    paint();
  }

  function toggle() {
    if (!st.running && !st.paused) { start(); return; }
    if (st.paused) {
      try { synth.resume(); } catch (e) {}
      st.paused = false;
    } else {
      try { synth.pause(); } catch (e) {}
      st.paused = true;
    }
    paint();
    reportState(st.paused ? 'paused' : 'playing');
  }

  function step(delta) {
    if (!units.length) return;
    var target = st.idx + delta;
    if (target < 0 || target >= units.length) return;
    speakFrom(target, 0);
  }

  /* ---------- header text ---------- */

  function setStatus(text) { el.sub.textContent = text; }

  function renderHead() {
    el.title.textContent = data.title || '';
    el.title.style.display = data.title ? '' : 'none';
    var chars = units.reduce(function (a, u) { return a + String(u.text || '').length; }, 0);
    setStatus(units.length ? fmt('statusCount', { n: units.length, c: chars }) : tr('waitingPush'));
  }

  /* ---------- wiring ---------- */

  st.rate = Math.min(2, Math.max(0.5, Number(el.rate.value) || 1));
  el.rateVal.textContent = st.rate.toFixed(2) + '×';
  applySpeed(data.speed);

  el.btnPlay.addEventListener('click', toggle);
  el.btnStop.addEventListener('click', stop);
  el.btnPrev.addEventListener('click', function () { step(-1); });
  el.btnNext.addEventListener('click', function () { step(1); });
  // Typing filters the list; the field shows the chosen voice again on close.
  el.voiceSearch.addEventListener('focus', function () {
    // Start empty so what you type is the whole search, with the current voice
    // shown as a placeholder instead of sitting in the box as text.
    var v = currentVoice();
    el.voiceSearch.value = '';
    if (v) el.voiceSearch.placeholder = voiceLabel(v);
    st.filter = '';
    st.hover = 0;
    renderVoiceList();
  });
  el.voiceSearch.addEventListener('input', function () {
    st.filter = el.voiceSearch.value;
    st.hover = 0;
    renderVoiceList();
  });
  el.voiceSearch.addEventListener('keydown', function (event) {
    var list = listShown.items.length ? listShown.items : matchingVoices();
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (!st.listOpen) { renderVoiceList(); return; }
      var step = event.key === 'ArrowDown' ? 1 : -1;
      setVoiceHover(Math.max(0, Math.min(list.length - 1, (st.hover < 0 ? 0 : st.hover) + step)));
      event.preventDefault();
      return;
    }
    if (event.key === 'Enter') {
      if (st.listOpen && list.length) chooseVoice(list[Math.max(0, Math.min(st.hover, list.length - 1))]);
      event.preventDefault();
      return;
    }
    if (event.key === 'Escape') { closeVoiceList(); event.preventDefault(); }
  });
  // Scrolling to the bottom streams in the next page of rows.
  el.voiceList.addEventListener('scroll', function () {
    if (!st.listOpen) return;
    if (listShown.count >= listShown.items.length) return;
    var room = el.voiceList.scrollHeight - el.voiceList.scrollTop - el.voiceList.clientHeight;
    if (room > 80) return;
    appendVoicePage();
    var rows = el.voiceList.querySelectorAll('.item');
    for (var i = 0; i < rows.length; i += 1) rows[i].className = itemClass(i, st.hover);
  });
  el.voiceSearch.addEventListener('blur', function () {
    // The list uses mousedown, so a click already chose by the time focus dies.
    setTimeout(function () { if (st.listOpen) closeVoiceList(); }, 120);
  });
  el.onlyLocal.addEventListener('change', function () { rebuildVoices(); paint(); });
  el.rate.addEventListener('input', function () {
    st.rate = Math.min(2, Math.max(0.5, Number(el.rate.value) || 1));
    el.rateVal.textContent = st.rate.toFixed(2) + '×';
    // A queued utterance keeps its old rate: re-queue from the word being read
    // so the change is audible right away.
    if (st.running) speakFrom(st.idx, st.boundary || 0);
  });

  applyLang(data.lang);

  // A page opened for a fresh push starts from the Host-injected data and never
  // saw a receiveUnits call, so it adopts that push here — and confirms it — or
  // the Host would never hear about this tab.
  if (data.id && units.length) {
    st.active = {
      id: String(data.id),
      messageId: String(data.messageId || ''),
      key: String(data.key || ''),
      units: units.length
    };
    ack(st.active.id, 'read', st.active.messageId);
  }

  if (!synth || typeof Utter !== 'function') {
    banner('err', tr('noWebSpeech'));
    el.btnPlay.disabled = true;
    return;
  }

  try { st.savedUri = localStorage.getItem(VOICE_KEY) || ''; } catch (e) {}
  rebuildVoices();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', rebuildVoices);
  [300, 900, 2000].forEach(function (ms) {
    setTimeout(function () {
      rebuildVoices();
      if (ms === 2000 && !st.visible.length) {
        banner(el.onlyLocal.checked ? 'warn' : 'err', el.onlyLocal.checked
          ? tr('noOfflineVoices')
          : tr('noVoicesAtAll'));
      }
    }, ms);
  });

  /* ---------- DSH pushes new text to this page ---------- */

  function receiveUnits(payload) {
    var next = Array.isArray(payload.units) ? payload.units : [];
    if (!next.length) return;
    // Confirm receipt before this page can spend minutes speaking it.
    if (payload.id) ack(payload.id, 'read', payload.messageId);
    // Reading or waiting: this push goes to the back of the line. Cutting off
    // the paragraph being spoken is exactly what the queue exists to prevent.
    if (st.running || st.paused || st.queue.length) {
      st.queue.push(payload);
      reportQueued(payload);
      paintDot();
      return;
    }
    playPayload(payload);
  }

  /** Make one push the current text, then read it from the top. */
  function playPayload(payload) {
    var next = Array.isArray(payload.units) ? payload.units : [];
    if (!next.length) return;
    st.active = {
      id: payload.id ? String(payload.id) : '',
      messageId: payload.messageId ? String(payload.messageId) : '',
      key: payload.key ? String(payload.key) : '',
      units: next.length
    };
    units = next.map(function (u, i) { return { index: i, text: String((u && u.text) || '') }; });
    data.title = String(payload.title || '');
    if (payload.scheme) applyScheme(payload.scheme);
    if (payload.lang) applyLang(payload.lang);
    st.stop = false;
    st.done = false;
    st.idx = 0;
    st.startedAt = 0;
    applySpeed(payload.speed);
    renderDoc();
    renderHead();
    // The page usually already saw a click, so this just plays; otherwise the
    // not-allowed path asks for one click instead of failing.
    start();
  }

  /** Next push in line, only once nothing is being read. */
  function drainQueue() {
    if (st.running || st.paused || !st.queue.length) return;
    playPayload(st.queue.shift());
  }

  /** Theme and language arrive on their own channel, without any text. */
  function applyPrefs(prefs) {
    if (!prefs) return;
    if (prefs.scheme === 'light' || prefs.scheme === 'dark') applyScheme(prefs.scheme);
    if (typeof prefs.lang === 'string' && prefs.lang && prefs.lang !== data.lang) {
      data.lang = prefs.lang;
      applyLang(prefs.lang);
      rebuildVoices();
      paint();
    }
  }

  function connectBridgeStream() {
    if (typeof EventSource !== 'function') return;
    var dir = String(location.pathname || '').replace(/\/[^/]*$/, '');
    var source;
    try { source = new EventSource(dir + '/bridge/stream'); } catch (e) { return; }
    var everOpen = false;
    source.onopen = function () {
      everOpen = true;
      st.dotState = 'ok';
      st.dotTitle = tr('connected');
      paintDot();
    };
    source.onmessage = function (event) {
      var payload = null;
      try { payload = JSON.parse(event.data); } catch (e) { return; }
      if (!payload) return;
      if (payload.type === 'prefs') { applyPrefs(payload); return; }
      if (payload.type !== 'read') return;
      receiveUnits(payload);
    };
    source.onerror = function () {
      st.dotState = 'warn';
      st.dotTitle = everOpen ? tr('disconnected') : tr('notConnectedYet');
      paintDot();
      if (everOpen) return;
      // A tab left over from before a Host restart — or one opened from a file
      // or a plain static server — can never reconnect. Say it out loud: a
      // waiting page with no explanation looks like the page is broken.
      setTimeout(function () {
        if (everOpen) return;
        st.dotTitle = tr('stalePage');
        paintDot();
        banner('warn', tr('staleBanner'));
      }, 2000);
    };
  }

  connectBridgeStream();

  // Chrome/Edge usually allow speech before any gesture; when they do not, the
  // not-allowed path asks for one click instead of failing.
  var autoTries = 0;
  function autoStart() {
    if (st.attempted || !units.length) return;
    if (!st.visible.length) { if (autoTries++ < 6) setTimeout(autoStart, 400); return; }
    start();
  }
  setTimeout(autoStart, 500);
})();
</script>
</body>
</html>
