<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浏览器朗读</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#9aa4b2;
    --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --accent:#60a5fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Mono", monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:22px 18px 56px;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  h1{font-size:17px;margin:0;font-weight:600}
  .sub{color:var(--dim);font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .row + .row{margin-top:9px}
  select,input[type=number]{background:#0c0e12;color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:7px 9px;font:inherit}
  select{min-width:min(420px,100%)}
  input[type=range]{width:150px;accent-color:var(--accent)}
  button{background:#232838;color:var(--fg);border:1px solid var(--line);border-radius:7px;
    padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
  button:hover:not(:disabled){background:#2b3245}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.primary{background:#2563eb;border-color:#2563eb}
  button.primary:hover:not(:disabled){background:#1d4ed8}
  label.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none}
  .val{font-family:var(--mono);font-size:12.5px;min-width:46px;display:inline-block}
  #bar{height:4px;background:#0c0e12;border-radius:2px;overflow:hidden;margin-top:10px}
  #fill{height:100%;width:0;background:var(--accent);transition:width .2s linear}
  #now{margin-top:10px;padding:10px 12px;background:#0c0e12;border:1px solid var(--line);
    border-radius:7px;min-height:52px;line-height:1.75;max-height:190px;overflow:auto;font-size:13.5px}
  #now mark{background:rgba(96,165,250,.28);color:#dbeafe;border-radius:3px;padding:0 1px}
  #banner{display:none;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.6}
  #banner.show{display:block}
  #banner.warn{background:rgba(251,191,36,.12);color:var(--warn);border:1px solid rgba(251,191,36,.35)}
  #banner.err{background:rgba(248,113,113,.12);color:var(--err);border:1px solid rgba(248,113,113,.35)}
  #banner b{font-weight:600}
  #meta{font-size:12px;color:var(--dim);font-family:var(--mono)}
</style>
</head>
<body>
<main>
  <div>
    <h1>浏览器朗读</h1>
    <div class="sub" id="sub">正在读取…</div>
  </div>

  <div id="banner"></div>

  <section class="card">
    <div class="row">
      <select id="voiceSel"><option value="">（正在读取本机语音…）</option></select>
      <label class="chk"><input type="checkbox" id="onlyLocal"> 只看本地音色（不走厂商服务器）</label>
    </div>
    <div class="row">
      <button id="btnPlay" class="primary">开始朗读</button>
      <button id="btnPause" disabled>暂停</button>
      <button id="btnPrev" disabled>上一段</button>
      <button id="btnNext" disabled>下一段</button>
      <button id="btnStop" disabled>停止</button>
      <span class="row" style="gap:6px;margin-left:auto">
        <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1"><span class="val" id="rateVal">1.00×</span>
      </span>
    </div>
    <div id="bar"><div id="fill"></div></div>
    <div id="now" class="sub">点“开始朗读”后用浏览器自带的语音朗读。</div>
    <div class="row" style="margin-top:9px"><span id="meta">—</span></div>
  </section>
</main>

<script>window.__BRIDGE__ = __BRIDGE_DATA__;</script>
<script>
(function () {
  'use strict';
  var data = window.__BRIDGE__ || {};
  var units = Array.isArray(data.units) ? data.units : [];
  var synth = window.speechSynthesis;
  var Utter = window.SpeechSynthesisUtterance;
  var FIRST_SOUND_TIMEOUT = 8000;

  var el = {};
  ['sub','banner','voiceSel','onlyLocal','btnPlay','btnPause','btnPrev','btnNext','btnStop',
   'rate','rateVal','fill','now','meta'].forEach(function (id) { el[id] = document.getElementById(id); });

  var st = {
    voices: [], visible: [], idx: 0, running: false, paused: false, stop: false,
    gen: 0, watchdog: 0, boundary: 0, attempted: false, chars: 0, speechMs: 0, startedAt: 0,
    rate: 1, savedUri: ''
  };

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) { return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; });
  }
  function fmt(ms) { return ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' s'; }
  function isZh(v) { return /^zh/i.test(v.lang || ''); }
  function isCloud(v) { return v.localService === false; }
  function isGoogle(v) { return /^google/i.test(v.name || ''); }

  function banner(kind, html) {
    el.banner.className = 'show ' + kind;
    el.banner.innerHTML = html;
  }
  function clearBanner() { el.banner.className = ''; el.banner.innerHTML = ''; }

  function setMeta(text) { el.meta.textContent = text; }

  /** The settings page owns the speed; it arrives with the text. */
  function applySpeed(value) {
    var next = Number(value);
    if (!isFinite(next) || next <= 0) return;
    st.rate = Math.min(2, Math.max(0.5, Math.round(next * 100) / 100));
    el.rate.value = String(st.rate);
    el.rateVal.textContent = st.rate.toFixed(2) + '×';
  }

  /* ---------- voices ---------- */

  function allVoices() {
    try { return (synth && synth.getVoices()) || []; } catch (e) { return []; }
  }

  function sortVoices(list) {
    return list.slice().sort(function (a, b) {
      if (isZh(a) !== isZh(b)) return isZh(a) ? -1 : 1;
      if (isCloud(a) !== isCloud(b)) return isCloud(a) ? -1 : 1;
      var la = a.lang || '', lb = b.lang || '';
      if (la !== lb) return la < lb ? -1 : 1;
      return (a.name || '') < (b.name || '') ? -1 : 1;
    });
  }

  function rebuildVoices() {
    st.voices = sortVoices(allVoices());
    st.visible = el.onlyLocal.checked ? st.voices.filter(function (v) { return !isCloud(v); }) : st.voices;
    el.voiceSel.innerHTML = '';
    if (!st.visible.length) {
      var o0 = document.createElement('option');
      o0.value = '';
      o0.textContent = el.onlyLocal.checked ? '（没有本地音色）' : '（没有可用音色）';
      el.voiceSel.appendChild(o0);
      return;
    }
    st.visible.forEach(function (v, i) {
      var o = document.createElement('option');
      o.value = String(i);
      o.textContent = (isCloud(v) ? '☁ ' : '⌂ ') + v.name + ' · ' + v.lang;
      if (v.voiceURI === st.savedUri) o.selected = true;
      el.voiceSel.appendChild(o);
    });
    if (!el.voiceSel.value && st.visible.length) el.voiceSel.value = '0';
  }

  function currentVoice() {
    var i = parseInt(el.voiceSel.value, 10);
    return (i >= 0 && st.visible[i]) ? st.visible[i] : null;
  }

  function pickLocalVoice() {
    var pool = st.voices.filter(function (v) { return !isCloud(v); });
    if (!pool.length) return null;
    for (var i = 0; i < pool.length; i++) if (isZh(pool[i])) return pool[i];
    return pool[0];
  }

  function selectVoice(v) {
    if (!v) return false;
    if (st.visible.indexOf(v) < 0) { el.onlyLocal.checked = false; rebuildVoices(); }
    var i = st.visible.indexOf(v);
    if (i < 0) return false;
    el.voiceSel.value = String(i);
    return true;
  }

  /* ---------- speaking ---------- */

  function clearWatchdog() { if (st.watchdog) { clearTimeout(st.watchdog); st.watchdog = 0; } }

  function renderUnit(text, pos, len) {
    el.now.className = '';
    if (pos == null || pos < 0 || pos >= text.length) { el.now.textContent = text; return; }
    var end = Math.min(text.length, pos + Math.max(1, len || 1));
    el.now.innerHTML = esc(text.slice(0, pos)) + '<mark>' + esc(text.slice(pos, end)) + '</mark>' + esc(text.slice(end));
  }

  function paint() {
    var n = units.length || 1;
    el.fill.style.width = (Math.min(st.idx, n) / n * 100) + '%';
    el.btnPause.disabled = !st.running;
    el.btnPrev.disabled = !st.running || st.idx <= 0;
    el.btnNext.disabled = !st.running || st.idx >= units.length - 1;
    el.btnStop.disabled = !st.running;
    el.btnPlay.disabled = st.running;
    el.btnPlay.textContent = st.running ? '朗读中…' : '开始朗读';
    el.btnPause.textContent = st.paused ? '继续' : '暂停';
  }

  function abort(reason, canRetryLocal) {
    st.stop = true;
    st.running = false;
    st.paused = false;
    clearWatchdog();
    try { synth && synth.cancel(); } catch (e) {}
    banner('err', '<b>' + esc(reason) + '</b>' + (canRetryLocal ? ' —— 可以点“开始朗读”换本地音色重试。' : ''));
    var local = pickLocalVoice();
    if (canRetryLocal && local && selectVoice(local)) {
      banner('warn', '<b>' + esc(reason) + '</b><br>已自动选用本地音色「' + esc(local.name) + '」，点“开始朗读”即可。');
    }
    paint();
  }

  function speakCurrent(fromChar) {
    if (st.stop || st.idx >= units.length) return;
    var unit = units[st.idx] || {};
    var text = String(unit.text || '');
    if (!text) { st.idx++; speakCurrent(0); return; }
    var base = Math.max(0, Math.min(fromChar || 0, text.length - 1));
    var utter = new Utter(text.slice(base));
    var voice = currentVoice();
    if (voice) { utter.voice = voice; utter.lang = voice.lang; }
    utter.rate = st.rate;
    utter.pitch = 1;
    utter.volume = 1;

    var gen = ++st.gen;
    var started = false;
    st.paused = false;
    st.running = true;
    st.boundary = base;
    renderUnit(text, base, 1);
    paint();

    utter.onstart = function () {
      if (gen !== st.gen) return;
      started = true;
      clearWatchdog();
      if (!st.startedAt) st.startedAt = performance.now();
      setMeta('第 ' + (st.idx + 1) + '/' + units.length + ' 段 · ' + fmt(text.length) + ' 字 · ' +
        (voice ? voice.name : '浏览器默认') + ' · ' + st.rate.toFixed(2) + '×');
      try { if (!synth.paused) return; synth.resume(); } catch (e) {}
    };
    utter.onboundary = function (e) {
      if (gen !== st.gen || typeof e.charIndex !== 'number') return;
      st.boundary = base + e.charIndex;
      renderUnit(text, st.boundary, e.charLength || 1);
    };
    utter.onend = function () {
      if (gen !== st.gen) return;
      clearWatchdog();
      st.boundary = 0;
      if (st.stop) return;
      if (st.idx + 1 >= units.length) { finish(); return; }
      st.idx++;
      setTimeout(function () { if (!st.stop) speakCurrent(0); }, 40);
    };
    utter.onerror = function (e) {
      if (gen !== st.gen) return;
      var err = (e && e.error) || 'unknown';
      if (err === 'interrupted' || err === 'canceled') return;
      clearWatchdog();
      if (err === 'not-allowed') {
        // Autoplay policy: a page opened without any interaction may not speak.
        // This is not a failure, it is a request for one click.
        st.running = false;
        st.paused = false;
        st.gen++;
        el.now.textContent = '点「开始朗读」开始（浏览器要求先有一次点击才允许发声）。';
        el.now.className = 'sub';
        paint();
        banner('warn', '<b>浏览器要求先点一下。</b>自动播放策略不允许页面在没有交互时发声，点「开始朗读」即可。');
        return;
      }
      abort('第 ' + (st.idx + 1) + ' 段朗读失败：' + err, false);
    };

    clearWatchdog();
    st.watchdog = setTimeout(function () {
      st.watchdog = 0;
      if (started || st.stop) return;
      var local = pickLocalVoice();
      if (voice && isCloud(voice)) {
        abort('这个音色在 ' + (FIRST_SOUND_TIMEOUT / 1000) + ' 秒内没有出声（多半是连不上厂商服务器）', !!local);
      } else {
        abort('浏览器 ' + (FIRST_SOUND_TIMEOUT / 1000) + ' 秒内没有出声，可能需要先在本页点一下才开始朗读', false);
      }
    }, FIRST_SOUND_TIMEOUT);

    try {
      synth.speak(utter);
      st.attempted = true;
    } catch (e) {
      abort('浏览器拒绝朗读：' + (e && e.message ? e.message : String(e)), false);
    }
  }

  function finish() {
    st.running = false;
    st.paused = false;
    clearWatchdog();
    el.fill.style.width = '100%';
    st.idx = units.length;
    setMeta('已读完 ' + units.length + ' 段' + (st.startedAt ? ' · 用时 ' + fmt(performance.now() - st.startedAt) : ''));
    paint();
  }

  function start() {
    if (!units.length) return;
    if (!currentVoice()) { banner('err', '这台浏览器没有可用的语音，无法朗读。'); return; }
    clearBanner();
    st.stop = false;
    st.startedAt = 0;
    st.idx = 0;
    speakCurrent(0);
  }

  function stop() {
    st.stop = true;
    st.running = false;
    st.paused = false;
    st.gen++;
    clearWatchdog();
    try { synth.cancel(); } catch (e) {}
    el.fill.style.width = '0%';
    el.now.textContent = '已停止。';
    el.now.className = 'sub';
    setMeta('已停止');
    paint();
  }

  function togglePause() {
    if (!st.running) return;
    if (st.paused) {
      try { synth.resume(); } catch (e) {}
      st.paused = false;
    } else {
      try { synth.pause(); } catch (e) {}
      st.paused = true;
    }
    paint();
  }

  function step(delta) {
    if (!st.running && !units.length) return;
    var target = st.idx + delta;
    if (target < 0 || target >= units.length) return;
    st.stop = false;
    st.running = true;
    st.idx = target;
    st.gen++;
    clearWatchdog();
    try { synth.cancel(); } catch (e) {}
    setTimeout(function () { speakCurrent(0); }, 40);
  }

  /* ---------- wiring ---------- */

  function renderSub() {
    el.sub.textContent = (data.title ? data.title + ' · ' : '') + units.length + ' 段 · 共 ' +
      units.reduce(function (a, u) { return a + String(u.text || '').length; }, 0) + ' 字';
  }

  el.sub.textContent = ''
  st.rate = Math.min(2, Math.max(0.5, Number(el.rate.value) || 1));
  el.rateVal.textContent = st.rate.toFixed(2) + '×';
  applySpeed(data.speed);

  el.btnPlay.addEventListener('click', start);
  el.btnPause.addEventListener('click', togglePause);
  el.btnStop.addEventListener('click', stop);
  el.btnPrev.addEventListener('click', function () { step(-1); });
  el.btnNext.addEventListener('click', function () { step(1); });
  el.voiceSel.addEventListener('change', function () {
    var v = currentVoice();
    if (v) { st.savedUri = v.voiceURI; try { localStorage.setItem('dsh-tts-bridge:voice-v2', v.voiceURI || ''); } catch (e) {} }
  });
  el.onlyLocal.addEventListener('change', function () { rebuildVoices(); paint(); });
  el.rate.addEventListener('input', function () {
    st.rate = Math.min(2, Math.max(0.5, Number(el.rate.value) || 1));
    el.rateVal.textContent = st.rate.toFixed(2) + '×';
    // A running utterance keeps its old rate; restart the current paragraph
    // from the last word boundary so the change is audible immediately.
    if (st.running) {
      var keep = st.boundary || 0;
      st.gen++;
      clearWatchdog();
      try { synth.cancel(); } catch (e) {}
      setTimeout(function () { speakCurrent(keep); }, 40);
    }
  });

  if (!synth || typeof Utter !== 'function') {
    banner('err', '<b>这个浏览器不支持 Web Speech 语音合成。</b>');
    el.btnPlay.disabled = true;
    return;
  }

  try { st.savedUri = localStorage.getItem('dsh-tts-bridge:voice-v2') || ''; } catch (e) {}

  rebuildVoices();
  if (synth.addEventListener) synth.addEventListener('voiceschanged', rebuildVoices);
  [300, 900, 2000].forEach(function (ms) {
    setTimeout(function () {
      rebuildVoices();
      if (ms === 2000) {
        if (!st.visible.length && !el.onlyLocal.checked) {
          banner('err', '<b>这个内核没有暴露任何语音。</b>');
        } else if (!st.visible.length) {
          banner('warn', '本机没有离线音色；取消勾选“只看本地音色”可以用云端音色（需要联网）。');
        }
      }
    }, ms);
  });

  paint();
  renderSub();

  /* ---------- 长期连接：DSH 把新的朗读内容推到这一页 ---------- */

  function receiveUnits(payload) {
    var next = Array.isArray(payload.units) ? payload.units : [];
    if (!next.length) return;
    stop();
    units = next.map(function (u, i) { return { index: i, text: String((u && u.text) || '') }; });
    data.title = String(payload.title || '');
    st.stop = false;
    st.idx = 0;
    st.startedAt = 0;
    applySpeed(payload.speed);
    renderSub();
    // The page already saw a click earlier, so this usually just plays; if not,
    // the not-allowed path asks for one click instead of failing.
    start();
  }

  function connectBridgeStream() {
    if (typeof EventSource !== 'function') return;
    var dir = String(location.pathname || '').replace(/\/[^/]*$/, '');
    var source;
    try { source = new EventSource(dir + '/bridge/stream'); } catch (e) { return; }
    var everOpen = false;
    source.onopen = function () {
      everOpen = true;
      setMeta('已连接 DSH：新的朗读会自动送到这一页');
    };
    source.onmessage = function (event) {
      var payload = null;
      try { payload = JSON.parse(event.data); } catch (e) { return; }
      if (!payload || payload.type !== 'read') return;
      receiveUnits(payload);
    };
    source.onerror = function () {
      if (everOpen) { setMeta('与 DSH 的连接断开，正在重连…'); return; }
      // A tab left over from before a Host restart can never reconnect; say so
      // instead of waiting silently for a push that will not arrive.
      setTimeout(function () {
        if (!everOpen) setMeta('还没连上 DSH：Host 重启后请刷新本页');
      }, 2000);
    };
  }

  connectBridgeStream();

  // Chrome/Edge often allow speech before any gesture; when they do not the
  // watchdog above turns it into an actionable message instead of a hang.
  var autoTries = 0;
  function autoStart() {
    if (st.attempted || !units.length) return;
    if (!st.visible.length) { if (autoTries++ < 6) setTimeout(autoStart, 400); return; }
    start();
  }
  setTimeout(autoStart, 500);
})();
</script>
</body>
</html>
