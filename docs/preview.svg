<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Read aloud: a reply being read with a highlighted paragraph and word, next to a small playback bar</title>
  <desc id="desc">A speaker on the left sends sound arcs to a document card. One paragraph in the card is tinted blue and one word inside it is marked amber; a compact player with previous, pause and next controls reads on the right.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="pick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="none"/>

  <!-- document card -->
  <rect x="146" y="42" width="316" height="216" rx="16" fill="url(#card)" stroke="#8b95a5" stroke-opacity="0.45"/>
  <rect x="166" y="62" width="120" height="12" rx="6" fill="#8b95a5" fill-opacity="0.40"/>

  <!-- first paragraph -->
  <rect x="166" y="96" width="232" height="10" rx="5" fill="#8b95a5" fill-opacity="0.28"/>
  <rect x="166" y="114" width="188" height="10" rx="5" fill="#8b95a5" fill-opacity="0.28"/>

  <!-- the paragraph being read: tinted block, amber word inside it -->
  <rect x="160" y="136" width="276" height="42" rx="8" fill="url(#pick)"/>
  <rect x="172" y="148" width="150" height="10" rx="5" fill="#93c5fd" fill-opacity="0.85"/>
  <rect x="328" y="146" width="34" height="14" rx="4" fill="#f5c542"/>
  <rect x="370" y="148" width="54" height="10" rx="5" fill="#93c5fd" fill-opacity="0.85"/>

  <!-- last paragraph -->
  <rect x="166" y="192" width="204" height="10" rx="5" fill="#8b95a5" fill-opacity="0.28"/>
  <rect x="166" y="210" width="140" height="10" rx="5" fill="#8b95a5" fill-opacity="0.20"/>

  <!-- speaker button: 66x66 box centred on (61,135), glyph centred in it -->
  <rect x="28" y="102" width="66" height="66" rx="18" fill="#3b82f6" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.55"/>
  <g transform="translate(-1.7 0)">
    <path d="M41 128h11l13-12v38l-13-12h-11z" fill="#60a5fa" fill-opacity="0.95"/>
    <path d="M68 126a10 10 0 0 1 0 18" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <path d="M74 120a16 16 0 0 1 0 30" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
  </g>

  <!-- sound reaching the card -->
  <path d="M100 135h26" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- floating player: 132x86 card, controls on one centre line (y=145) -->
  <rect x="486" y="96" width="132" height="86" rx="14" fill="url(#card)" stroke="#8b95a5" stroke-opacity="0.45"/>
  <rect x="502" y="110" width="100" height="6" rx="3" fill="#8b95a5" fill-opacity="0.30"/>
  <rect x="502" y="110" width="52" height="6" rx="3" fill="#3b82f6"/>
  <rect x="502" y="132" width="26" height="26" rx="8" fill="none" stroke="#8b95a5" stroke-opacity="0.55"/>
  <path d="M517 139v12l-8-6z" fill="#c9d2e0"/>
  <rect x="536" y="128" width="34" height="34" rx="10" fill="#3b82f6" fill-opacity="0.22" stroke="#60a5fa" stroke-opacity="0.7"/>
  <rect x="546" y="137" width="4" height="16" rx="2" fill="#93c5fd"/>
  <rect x="556" y="137" width="4" height="16" rx="2" fill="#93c5fd"/>
  <rect x="580" y="132" width="26" height="26" rx="8" fill="none" stroke="#8b95a5" stroke-opacity="0.55"/>
  <path d="M591 139v12l8-6z" fill="#c9d2e0"/>
  <rect x="502" y="166" width="100" height="4" rx="2" fill="#8b95a5" fill-opacity="0.25"/>
  <circle cx="534" cy="168" r="6" fill="#3b82f6"/>
</svg>
